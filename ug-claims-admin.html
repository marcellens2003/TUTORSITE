<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Undergraduate Claims Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Rubik,Arial,sans-serif;background:linear-gradient(135deg,#06183f,#0b2d76 55%,#123c94);padding:18px;color:#1f2937}.page{max-width:1200px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#08183f,#102a72 52%,#1d3a8f);color:#fff;border-radius:16px;padding:19px 22px;border-top:4px solid #ffd34d;box-shadow:0 14px 36px rgba(5,16,48,.35)}.top h1{margin:0;font-size:24px}.top p{margin:6px 0 0;color:#ffe08a;font-size:13px}.card{background:#fff;border-radius:14px;padding:20px 22px;margin-top:15px;box-shadow:0 14px 36px rgba(5,16,48,.24)}h2{margin:0 0 13px;color:#002147;font-size:18px;border-bottom:2px solid #0056b3;padding-bottom:8px}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(340px,.8fr);gap:15px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>div{flex:1;min-width:180px}label{display:block;margin:10px 0 5px;font-size:13px;font-weight:700}input,textarea,select{width:100%;padding:10px 11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:88px}.btn{border:0;border-radius:8px;padding:10px 14px;background:#0056b3;color:#fff;font:inherit;font-weight:700;cursor:pointer}.btn.secondary{background:#eef2f7;color:#24364b;border:1px solid #cbd5e1}.btn.danger{background:#c7353f}.btn.success{background:#198754}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.status{display:none;margin-top:12px;padding:11px 13px;border-radius:9px;font-size:13px;line-height:1.45}.status.ok{display:block;background:#d4edda;color:#155724}.status.warn{display:block;background:#fff3cd;color:#806000}.status.err{display:block;background:#f8d7da;color:#721c24}.hidden{display:none!important}.tablewrap{overflow:auto;max-height:620px;border:1px solid #e5e7eb;border-radius:10px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}th{position:sticky;top:0;background:#f8fafc;color:#002147}.tiny{font-size:12px;color:#667085;line-height:1.5}.badge{display:inline-block;padding:3px 7px;border-radius:999px;background:#e8f1ff;color:#0b4aa2;font-size:11px;font-weight:700}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail{border:1px solid #e5e7eb;border-radius:8px;padding:9px}.detail b{display:block;color:#667085;font-size:10px;text-transform:uppercase;margin-bottom:3px}.signature{max-width:100%;max-height:120px;border:1px solid #ddd}.sticky{position:sticky;top:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}.sticky{position:static}body{padding:10px}}@media print{body{background:#fff;padding:0}.top,#loginCard,#listCard,.toolbar,#globalStatus{display:none!important}.page{max-width:none}.card{box-shadow:none;border-radius:0;margin:0}.sticky{position:static}}
</style>
</head>
<body><div class="page">
<div class="top"><div><h1>Undergraduate Claims Admin</h1><p>Review, edit, print and export facilitator claims.</p></div><div class="toolbar"><a class="btn secondary" href="ug-tutor-admin.html" target="_blank">Tutor Admin</a><button id="logoutBtn" class="btn danger hidden">Sign out</button></div></div>
<div id="globalStatus" class="status warn">Loading Firebase…</div>
<div id="loginCard" class="card"><h2>Administrator Sign In</h2><div class="row"><div><label>Email</label><input id="email" type="email"></div><div><label>Password</label><input id="pass" type="password"></div><div style="flex:0 0 auto"><button id="loginBtn" class="btn">Sign in</button></div></div></div>
<div id="dashboard" class="layout hidden">
<div id="listCard" class="card"><h2>Claims</h2><div class="row"><div><label>Search</label><input id="search" placeholder="Staff ID, tutor, course, centre"></div><div><label>Status</label><select id="filterStatus"><option value="">All statuses</option><option>Submitted</option><option>Approved</option><option>Queried</option><option>Paid</option><option>Cancelled</option></select></div></div><div class="toolbar"><button id="loadBtn" class="btn">Load claims</button><button id="csvBtn" class="btn success">Export visible CSV</button></div><p id="count" class="tiny">—</p><div class="tablewrap"><table><thead><tr><th>Tutor / Course</th><th>Details</th><th>Action</th></tr></thead><tbody id="body"><tr><td colspan="3">Load claims to begin.</td></tr></tbody></table></div></div>
<div class="card sticky"><h2>Claim Details</h2><div id="emptyDetail" class="tiny">Select a claim from the list.</div><div id="detail" class="hidden"><div id="detailGrid" class="detail-grid"></div><label>Claim Status</label><select id="editStatus"><option>Submitted</option><option>Approved</option><option>Queried</option><option>Paid</option><option>Cancelled</option></select><label>Administrator Remarks</label><textarea id="adminRemarks"></textarea><div id="signatureWrap" class="hidden"><label>Signature</label><img id="signature" class="signature" alt="Facilitator signature"></div><div class="toolbar"><button id="saveBtn" class="btn success">Save Changes</button><button id="printBtn" class="btn secondary">Print Claim</button><button id="deleteBtn" class="btn danger">Delete</button></div><div id="detailStatus" class="status"></div></div></div>
</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import { getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import { getFirestore,doc,getDoc,collection,getDocs,updateDoc,deleteDoc,serverTimestamp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyCzgOGc51Qr6DXnJ-zkczBtGniYNLf0jOw",authDomain:"monitoringucc.firebaseapp.com",projectId:"monitoringucc",storageBucket:"monitoringucc.firebasestorage.app",messagingSenderId:"210063574932",appId:"1:210063574932:web:8ccd563312321dcd2af181"};const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let claims=[],visible=[],selected=null;
function norm(v){return String(v??"").trim()}function esc(v){return norm(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function status(el,msg,type){el.textContent=msg;el.className="status "+type}function when(v){try{if(v?.toDate)return v.toDate().toLocaleString();if(v?.seconds)return new Date(v.seconds*1000).toLocaleString();return norm(v)}catch{return""}}
async function verifyAdmin(u){const s=await getDoc(doc(db,"admins",u.uid));if(!s.exists())throw new Error("This account is not listed in the admins collection.")}
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("pass").value)}catch(e){status($("globalStatus"),e.message,"err")}};$("logoutBtn").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{if(!u){$("loginCard").classList.remove("hidden");$("dashboard").classList.add("hidden");$("logoutBtn").classList.add("hidden");status($("globalStatus"),"Sign in with an administrator account.","warn");return}try{await verifyAdmin(u);$("loginCard").classList.add("hidden");$("dashboard").classList.remove("hidden");$("logoutBtn").classList.remove("hidden");status($("globalStatus"),"Administrator access confirmed.","ok")}catch(e){status($("globalStatus"),e.message,"err");await signOut(auth)}});
$("loadBtn").onclick=loadClaims;async function loadClaims(){$("body").innerHTML='<tr><td colspan="3">Loading…</td></tr>';try{const snap=await getDocs(collection(db,"ug_claims"));claims=[];snap.forEach(s=>claims.push({id:s.id,...s.data()}));claims.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));applyFilters()}catch(e){$("body").innerHTML=`<tr><td colspan="3">${esc(e.message)}</td></tr>`}}
function applyFilters(){const q=norm($("search").value).toLowerCase(),s=norm($("filterStatus").value).toLowerCase();visible=claims.filter(c=>{const text=[c.id,c.staffId,c.tutorName,c.course,c.program,c.studyCentre,c.semester,c.claimStatus].join(" ").toLowerCase();return(!q||text.includes(q))&&(!s||norm(c.claimStatus||"Submitted").toLowerCase()===s)});$("count").textContent=`${visible.length} of ${claims.length} claims`;$("body").innerHTML=visible.length?visible.map(c=>`<tr><td><strong>${esc(c.tutorName||"Unknown tutor")}</strong><br><span class="tiny">${esc(c.staffId)} • ${esc(c.course)}</span></td><td><span class="badge">${esc(c.claimStatus||"Submitted")}</span><br><span class="tiny">${esc(c.program)} • ${esc(c.studyCentre)}<br>${esc(c.semester)} • ${esc(c.totalHours)} hours<br>${esc(when(c.createdAt))}</span></td><td><button class="btn secondary" data-open="${esc(c.id)}">Open</button></td></tr>`).join(""):'<tr><td colspan="3">No matching claims.</td></tr>';$("body").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openClaim(b.dataset.open))}
$("search").oninput=applyFilters;$("filterStatus").onchange=applyFilters;
function detailCell(k,v){return `<div class="detail"><b>${esc(k)}</b>${esc(v||"—")}</div>`}
function openClaim(id){selected=claims.find(c=>c.id===id);if(!selected)return;$("emptyDetail").classList.add("hidden");$("detail").classList.remove("hidden");const fields=[["Claim ID",selected.claimId||selected.id],["Staff ID",selected.staffId],["Tutor",selected.tutorName],["Course",selected.course],["Programme",selected.program||selected.programme],["Study Centre",selected.studyCentre],["Semester",selected.semester],["Mode",selected.modeOfDelivery],["Academic Year",selected.academicYear],["F2F Hours",selected.f2fHours],["Online Hours",selected.onHours],["Total Hours",selected.totalHours],["Phone",selected.phone],["Ghana Card",selected.ghanaCardNumber],["Bank",selected.bankName],["Branch",selected.bankBranch],["Account Number",selected.accountNumber],["Sessions",selected.sessionDetails],["Tutor Remarks",selected.remarks],["Submitted",when(selected.createdAt)]];$("detailGrid").innerHTML=fields.map(x=>detailCell(x[0],x[1])).join("");$("editStatus").value=selected.claimStatus||"Submitted";$("adminRemarks").value=selected.adminRemarks||"";if(selected.facilitatorSignature){$("signature").src=selected.facilitatorSignature;$("signatureWrap").classList.remove("hidden")}else $("signatureWrap").classList.add("hidden");$("detailStatus").className="status"}
$("saveBtn").onclick=async()=>{if(!selected)return;try{await updateDoc(doc(db,"ug_claims",selected.id),{claimStatus:$("editStatus").value,adminRemarks:$("adminRemarks").value,adminUpdatedAt:serverTimestamp()});selected.claimStatus=$("editStatus").value;selected.adminRemarks=$("adminRemarks").value;status($("detailStatus"),"Claim updated.","ok");applyFilters()}catch(e){status($("detailStatus"),e.message,"err")}};
$("deleteBtn").onclick=async()=>{if(!selected||!confirm("Delete this claim permanently?"))return;try{await deleteDoc(doc(db,"ug_claims",selected.id));claims=claims.filter(c=>c.id!==selected.id);selected=null;$("detail").classList.add("hidden");$("emptyDetail").classList.remove("hidden");applyFilters()}catch(e){status($("detailStatus"),e.message,"err")}};$("printBtn").onclick=()=>window.print();
$("csvBtn").onclick=()=>{const cols=["claimId","staffId","tutorName","course","program","studyCentre","semester","modeOfDelivery","academicYear","f2fHours","onHours","totalHours","claimStatus","phone","ghanaCardNumber","bankName","bankBranch","accountNumber","adminRemarks"];const csv=[cols.join(","),...visible.map(r=>cols.map(k=>'"'+norm(r[k]).replace(/"/g,'""')+'"').join(","))].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="undergraduate-claims.csv";a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
