<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facilitator Claim Summary Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { max-width: 100%; overflow-x: hidden; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Rubik", Arial, sans-serif;
      background: #0a1f5c;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background: url("books-bg-blur.jpg") center/cover no-repeat;
      transform: scale(1.04);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(10,31,92,.32));
    }
    .card {
      width: 100%;
      max-width: 484px;
      background: rgba(255,255,255,.98);
      border: 1px solid rgba(255,255,255,.68);
      border-radius: 16px;
      box-shadow: 0 18px 55px rgba(5,16,48,.48);
      overflow: hidden;
    }
    .header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 20px 32px 24px;
      background:
        radial-gradient(80% 120% at 90% -20%, rgba(255,211,77,.20), rgba(255,211,77,0) 55%),
        linear-gradient(135deg, #08183f 0%, #102a72 45%, #1d3a8f 82%, #244aa6 100%);
      box-shadow: inset 0 0 0 1px rgba(255,211,77,.22);
    }
    .header::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #e8b500, #ffd34d, #e8b500);
    }
    .header::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #d4362a 0 18%, #e8b500 18%, #ffd34d 50%, #e8b500 82%, #d4362a 82% 100%);
    }
    .logo {
      width: 62px;
      height: 62px;
      object-fit: contain;
      flex: 0 0 auto;
      filter: drop-shadow(0 2px 5px rgba(0,0,0,.42));
    }
    .header-copy {
      flex: 1;
      min-width: 0;
      text-align: center;
      color: #fff;
    }
    .header-copy h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.15;
      letter-spacing: .7px;
      font-weight: 800;
      text-shadow: 0 1px 3px rgba(0,0,0,.35);
    }
    .header-copy h1::after {
      content: "";
      display: block;
      width: 70px;
      height: 3px;
      margin: 8px auto 0;
      border-radius: 999px;
      background: radial-gradient(circle, #ffd34d 0%, rgba(255,211,77,.70) 42%, rgba(255,211,77,0) 76%);
      box-shadow: 0 0 10px rgba(255,211,77,.35);
    }
    .body { padding: 28px 33px 34px; }
    .field { margin-bottom: 20px; }
    label {
      display: block;
      margin-bottom: 7px;
      color: #344054;
      font-size: 14px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #c9d0da;
      border-radius: 7px;
      outline: none;
      font: inherit;
      font-size: 15px;
      background: #fff;
      transition: border-color .18s, box-shadow .18s;
    }
    input:focus {
      border-color: #1d3a8f;
      box-shadow: 0 0 0 3px rgba(29,58,143,.12);
    }
    .hint { margin-top: 5px; color: #667085; font-size: 12px; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 73px; }
    .toggle {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      border-radius: 5px;
      padding: 6px 8px;
      background: transparent;
      color: #1d3a8f;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .toggle:hover { background: #eef3fb; }
    .primary, .portal-btn {
      width: 100%;
      border: 0;
      border-radius: 7px;
      padding: 12px 14px;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
    .primary {
      margin-top: 3px;
      color: #fff;
      background: linear-gradient(135deg, #102a72, #1d3a8f);
    }
    .primary:hover { background: linear-gradient(135deg, #0a1f5c, #14307f); }
    .primary:disabled { background: #9caeca; cursor: not-allowed; }
    .message {
      display: none;
      margin: 0 0 14px;
      padding: 10px 11px;
      border-radius: 7px;
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
    }
    .error { color: #721c24; background: #f8d7da; border: 1px solid #f5c6cb; }
    .success { color: #155724; background: #d4edda; border: 1px solid #c3e6cb; }
    .loading {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin: 12px 0 0;
      color: #475467;
      font-size: 13px;
    }
    .spinner {
      width: 19px;
      height: 19px;
      border: 3px solid #e4e7ec;
      border-top-color: #1d3a8f;
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (min-width: 769px) and (hover:hover) {
      .card { background: rgba(255,255,255,.97); backdrop-filter: blur(2px); }
    }
    @media (max-width: 520px) {
      body { padding: 13px; }
      .body { padding: 23px 18px 25px; }
      .header { padding: 17px 13px 20px; gap: 8px; }
      .header-copy h1 { font-size: 18px; }
      
      .logo { width: 49px; height: 49px; }
      input { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="pageTitle">
    <header class="header">
      <img src="CoDE LOGO PNG.png" class="logo" alt="College of Distance Education logo"
           onerror="this.style.visibility='hidden'">
      <div class="header-copy">
        <h1 id="pageTitle">Facilitator Claim<br>Summary Login</h1>
      </div>
      <img src="UCC LOGO PNG.png" class="logo" alt="University of Cape Coast logo"
           onerror="this.style.visibility='hidden'">
    </header>

    <section class="body">
      <div id="loginPanel">
        <div class="field">
          <label for="staffId">Staff ID</label>
          <input id="staffId" type="text" placeholder="Enter your Staff ID"
                 autocomplete="username" autocapitalize="characters" spellcheck="false">
          <div class="hint">Enter your CoDE facilitator Staff ID.</div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
            <button id="passwordToggle" class="toggle" type="button" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>

        <div id="errorMessage" class="message error" role="alert"></div>
        <div id="successMessage" class="message success" role="status">Signed in successfully. Redirecting…</div>

        <button id="loginButton" class="primary" type="button">Sign in</button>
        <div id="loading" class="loading" aria-live="polite">
          <span class="spinner" aria-hidden="true"></span>
          <span>Checking your account…</span>
        </div>
      </div>

    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      setPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCzgOGc51Qr6DXnJ-zkczBtGniYNLf0jOw",
      authDomain: "monitoringucc.firebaseapp.com",
      projectId: "monitoringucc",
      storageBucket: "monitoringucc.firebasestorage.app",
      messagingSenderId: "210063574932",
      appId: "1:210063574932:web:8ccd563312321dcd2af181"
    };

    const ROUTES = {
      pg: "tutor-report.html",
      ug: "ug-tutor-report.html"
    };
    const COLLECTIONS = {
      pg: "tutors",
      ug: "ug_monitors"
    };
    const AUTH_DOMAIN = "tutors.ucc.local";
    const TEMPORARY_PASSWORD = "123456";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    await setPersistence(auth, browserSessionPersistence);

    const staffIdInput = document.getElementById("staffId");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const loginPanel = document.getElementById("loginPanel");
    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");
    const loading = document.getElementById("loading");
    const passwordToggle = document.getElementById("passwordToggle");

    let pendingPasswordWasTemporary = false;

    // Always begin with a fresh portal-routing session. The authenticated
    // Firebase user may persist in the tab, but the entered Staff ID below
    // determines whether the tutor is routed to postgraduate or undergraduate.
    clearStoredSession();

    function staffIdToEmail(staffId) {
      const slug = staffId.trim().toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
      return `${slug}@${AUTH_DOMAIN}`;
    }

    function normalizeStaffId(value) {
      return value.trim().toUpperCase();
    }

    function safeMonitorDocId(staffId) {
      const cleaned = normalizeStaffId(staffId)
        .replace(/[\/]+/g, "-")
        .replace(/[^A-Z0-9_.-]+/g, "-")
        .replace(/^-+|-+$/g, "");
      return cleaned || staffIdToEmail(staffId).split("@")[0] || "monitor";
    }

    function collectionDocId(portal, staffId) {
      return portal === "ug" ? safeMonitorDocId(staffId) : staffId;
    }

    function clearStoredSession() {
      [
        "tutorStaffId",
        "tutorName",
        "tutorPortal",
        "tutorCollection",
        "monitorStaffId",
        "monitorName",
        "monitorCollection",
        "forcePasswordChange"
      ].forEach(key => sessionStorage.removeItem(key));
    }

    function showError(message) {
      successMessage.style.display = "none";
      errorMessage.textContent = message;
      errorMessage.style.display = "block";
    }

    function clearMessages() {
      errorMessage.style.display = "none";
      successMessage.style.display = "none";
    }

    function setLoading(isLoading) {
      loading.style.display = isLoading ? "flex" : "none";
      loginButton.disabled = isLoading;
      staffIdInput.disabled = isLoading;
      passwordInput.disabled = isLoading;
    }

    function recordBelongsToUser(snapshot, uid) {
      if (!snapshot || !snapshot.exists()) return null;
      const data = snapshot.data() || {};
      if (data.uid && data.uid !== uid) return null;
      return data;
    }

    async function getTutorRecordSafely(portal, staffId, uid) {
      try {
        const snapshot = await getDoc(doc(db, COLLECTIONS[portal], collectionDocId(portal, staffId)));
        return {
          portal,
          record: recordBelongsToUser(snapshot, uid),
          permissionDenied: false,
          error: null
        };
      } catch (error) {
        // Firestore rules may deny the collection that does not contain the tutor.
        // Do not fail the whole login if the other collection verifies correctly.
        const denied = error && (error.code === "permission-denied" || error.code === "firestore/permission-denied");
        console.warn(`Could not check ${COLLECTIONS[portal]}/${collectionDocId(portal, staffId)}:`, error);
        return {
          portal,
          record: null,
          permissionDenied: denied,
          error
        };
      }
    }

    function savePortalSession(portal, staffId, data, passwordWasTemporary) {
      const displayName = data.name || data.fullName || staffId;
      sessionStorage.setItem("tutorPortal", portal);
      sessionStorage.setItem("tutorCollection", COLLECTIONS[portal]);

      if (portal === "ug") {
        sessionStorage.setItem("monitorStaffId", staffId);
        sessionStorage.setItem("monitorName", displayName);
        sessionStorage.setItem("monitorCollection", COLLECTIONS[portal]);
        sessionStorage.setItem("tutorStaffId", "");
        sessionStorage.setItem("tutorName", "");
      } else {
        sessionStorage.setItem("tutorStaffId", staffId);
        sessionStorage.setItem("tutorName", displayName);
        sessionStorage.removeItem("monitorStaffId");
        sessionStorage.removeItem("monitorName");
        sessionStorage.removeItem("monitorCollection");
      }

      if (passwordWasTemporary) {
        sessionStorage.setItem("forcePasswordChange", "1");
      } else {
        sessionStorage.removeItem("forcePasswordChange");
      }
    }

    function redirectToPortal(portal) {
      const route = ROUTES[portal];
      if (!route) {
        showError("The selected portal is not configured. Contact the administrator.");
        return;
      }
      successMessage.style.display = "block";
      window.setTimeout(() => window.location.replace(route), 350);
    }

    async function doLogin() {
      clearMessages();
      const staffId = normalizeStaffId(staffIdInput.value);
      const password = passwordInput.value;

      if (!staffId) {
        showError("Please enter your Staff ID.");
        staffIdInput.focus();
        return;
      }
      if (!password) {
        showError("Please enter your password.");
        passwordInput.focus();
        return;
      }

      setLoading(true);
      clearStoredSession();
      pendingPasswordWasTemporary = password === TEMPORARY_PASSWORD;

      try {
        const credential = await signInWithEmailAndPassword(auth, staffIdToEmail(staffId), password);

        const [pgResult, ugResult] = await Promise.all([
          getTutorRecordSafely("pg", staffId, credential.user.uid),
          getTutorRecordSafely("ug", staffId, credential.user.uid)
        ]);

        const pgRecord = pgResult.record;
        const ugRecord = ugResult.record;

        if (pgRecord && ugRecord) {
          await signOut(auth);
          setLoading(false);
          showError("This Staff ID appears in both the facilitator and undergraduate monitor directories. The administrator must correct the duplicate Staff ID before you can continue.");
          return;
        }

        if (pgRecord || ugRecord) {
          const portal = pgRecord ? "pg" : "ug";
          const record = pgRecord || ugRecord;
          savePortalSession(portal, staffId, record, pendingPasswordWasTemporary);
          setLoading(false);
          redirectToPortal(portal);
          return;
        }

        await signOut(auth);
        setLoading(false);

        if (pgResult.permissionDenied || ugResult.permissionDenied) {
          showError("The login was accepted, but Firestore blocked the account record check. Publish the updated Firestore rules and confirm this Staff ID exists in the correct collection.");
          return;
        }

        showError("Your account signed in, but this Staff ID was not found in the facilitator or monitor directories. Contact the administrator.");
        return;
      } catch (error) {
        console.error(error);
        setLoading(false);

        let message = "Could not sign in. Please try again.";
        if (["auth/invalid-credential", "auth/wrong-password", "auth/user-not-found", "auth/invalid-email"].includes(error.code)) {
          message = "Incorrect Staff ID or password. Please try again or contact the administrator.";
        } else if (error.code === "auth/too-many-requests") {
          message = "Too many unsuccessful attempts. Please wait briefly and try again.";
        } else if (error.code === "auth/network-request-failed") {
          message = "Network error. Check your internet connection and try again.";
        } else if (error.code === "permission-denied" || error.code === "firestore/permission-denied") {
          message = "Your account could not be verified against the facilitator directories. Check the Firestore rules or contact the administrator.";
        }
        showError(message);
      }
    }

    loginButton.addEventListener("click", doLogin);

    [staffIdInput, passwordInput].forEach(input => {
      input.addEventListener("keydown", event => {
        if (event.key === "Enter" && !loginButton.disabled) doLogin();
      });
    });

    passwordToggle.addEventListener("click", () => {
      const show = passwordInput.type === "password";
      passwordInput.type = show ? "text" : "password";
      passwordToggle.textContent = show ? "Hide" : "Show";
      passwordToggle.setAttribute("aria-label", show ? "Hide password" : "Show password");
      passwordToggle.setAttribute("aria-pressed", show ? "true" : "false");
    });
  </script>
</body>
</html>
